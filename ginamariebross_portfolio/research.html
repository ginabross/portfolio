<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>research – Gina-Marie Bross</title>
<meta name="description" content="Research: interests - Gina-Marie Bross.">
<style>
:root{--text:#000;--muted:#6b6b6b;--pad:clamp(20px,4vw,56px);--gap:clamp(12px,2vw,28px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
body.lb-open{overflow:hidden}
a{color:inherit;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,.field img:focus-visible{outline:2px solid #000;outline-offset:3px}
h1,p,figure{margin:0}
h1{font-size:clamp(20px,1.8vw,26px);font-weight:400}
h1 a{text-decoration:none}

.page{max-width:1440px;margin:0 auto;padding:0 var(--pad)}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 32px;padding:28px 0 0}
.top nav{display:flex;flex-wrap:wrap;gap:6px 24px}
.top nav a[aria-current]{text-decoration:none}

/* Fotofeld: locker verstreut angeordnet */
.field{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);row-gap:clamp(32px,6vw,88px);align-items:start;padding:clamp(56px,9vw,128px) 0 clamp(64px,10vw,140px)}
.field img{display:block;width:100%;height:auto;background:#f3f3f3;cursor:zoom-in}

/* Desktop und Tablet: jede 7. Position wiederholt sich, dadurch wirkt es zufällig */
@media (min-width:701px){
  .field figure:nth-child(7n+1){grid-column:1 / span 4}
  .field figure:nth-child(7n+2){grid-column:6 / span 3;margin-top:clamp(24px,6vw,96px)}
  .field figure:nth-child(7n+3){grid-column:10 / span 3;margin-top:clamp(8px,2vw,32px)}
  .field figure:nth-child(7n+4){grid-column:2 / span 5}
  .field figure:nth-child(7n+5){grid-column:8 / span 4;margin-top:clamp(24px,8vw,120px)}
  .field figure:nth-child(7n+6){grid-column:1 / span 3;margin-top:clamp(0px,2vw,24px)}
  .field figure:nth-child(7n+7){grid-column:5 / span 4;margin-top:clamp(16px,4vw,64px)}
}

/* Handy: eine Spalte, Bilder in wechselnder Breite und Position */
@media (max-width:700px){
  .top{padding-top:20px}
  .field{grid-template-columns:1fr;row-gap:28px}
  .field figure:nth-child(3n+1){width:80%}
  .field figure:nth-child(3n+2){width:60%;justify-self:end}
  .field figure:nth-child(3n+3){width:70%;margin-left:10%}
}

.legal{display:flex;gap:24px;padding:0 0 40px;font-size:14px;color:var(--muted)}

/* Vergrößerte Ansicht */
#lightbox{border:0;padding:0;margin:0;max-width:none;max-height:none;width:100%;height:100%;background:#fff;color:#000}
#lightbox[open]{display:grid;place-items:center}
#lightbox::backdrop{background:#fff}
#lightbox img{display:block;max-width:min(92vw,1800px);max-height:80vh;width:auto;height:auto;object-fit:contain;cursor:zoom-out}
.lb-btn{position:fixed;background:none;border:0;padding:12px;font:inherit;color:inherit;cursor:pointer}
.lb-btn:hover{text-decoration:underline;text-underline-offset:3px}
.lb-close{top:14px;right:calc(var(--pad) - 12px)}
.lb-prev{bottom:14px;left:calc(var(--pad) - 12px)}
.lb-next{bottom:14px;right:calc(var(--pad) - 12px)}
.lb-count{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1><a href="index.html">Gina-Marie Bross</a></h1>
    <nav aria-label="Seitenbereiche">
      <a href="portfolio.html#projekte">works</a>
      <a href="portfolio.html#statement">about</a>
      <a href="portfolio.html#kontakt">contact</a>
      <a href="research.html" aria-current="page">research</a>
    </nav>
  </header>

  <main>
    <!--
      FOTOS: Pro Foto eine Zeile <figure>…</figure>.
      Neue Fotos oben einfügen = erscheinen zuerst. Die Anordnung ergibt sich automatisch.
    -->
    <section class="field" aria-label="research">
      <figure><img src="images/research-01.jpg" alt="research, Foto 1" decoding="async"></figure>
      <figure><img src="images/research-02.jpg" alt="research, Foto 2" decoding="async"></figure>
      <figure><img src="images/research-03.jpg" alt="research, Foto 3" decoding="async"></figure>
      <figure><img src="images/research-04.jpg" alt="research, Foto 4" decoding="async"></figure>
      <figure><img src="images/research-05.jpg" alt="research, Foto 5" decoding="async"></figure>
      <figure><img src="images/research-06.jpg" alt="research, Foto 6" decoding="async"></figure>
      <figure><img src="images/research-07.jpg" alt="research, Foto 7" decoding="async"></figure>
      <figure><img src="images/research-08.jpg" alt="research, Foto 8" decoding="async"></figure>
      <figure><img src="images/research-09.jpg" alt="research, Foto 9" decoding="async"></figure>
    </section>
  </main>

  <div class="legal">
    <a href="impressum.html">legal</a>
  </div>

</div>

<dialog id="lightbox" aria-label="Vergrößerte Ansicht">
  <button class="lb-btn lb-close" type="button">close</button>
  <img alt="">
  <button class="lb-btn lb-prev" type="button">prev</button>
  <span class="lb-count" aria-live="polite"></span>
  <button class="lb-btn lb-next" type="button">next</button>
</dialog>

<script>
(function () {
  var imgs = Array.prototype.slice.call(document.querySelectorAll('.field img'));
  var dlg = document.getElementById('lightbox');
  var big = dlg.querySelector('img');
  var count = dlg.querySelector('.lb-count');
  var current = 0;

  function show(n) {
    current = (n + imgs.length) % imgs.length;
    big.src = imgs[current].currentSrc || imgs[current].src;
    big.alt = imgs[current].alt;
    count.textContent = (current + 1) + ' / ' + imgs.length;
  }
  function open(n) {
    show(n);
    document.body.classList.add('lb-open');
    dlg.showModal();
  }

  imgs.forEach(function (img, n) {
    img.setAttribute('tabindex', '0');
    img.setAttribute('role', 'button');
    img.addEventListener('click', function () { open(n); });
    img.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(n); }
    });
  });

  dlg.querySelector('.lb-prev').addEventListener('click', function () { show(current - 1); });
  dlg.querySelector('.lb-next').addEventListener('click', function () { show(current + 1); });
  dlg.addEventListener('click', function (e) {
    if (e.target.closest('.lb-prev, .lb-next')) return;
    dlg.close();
  });
  dlg.addEventListener('close', function () { document.body.classList.remove('lb-open'); });
  document.addEventListener('keydown', function (e) {
    if (!dlg.open) return;
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });

  var startX = null;
  dlg.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) { show(current + (dx < 0 ? 1 : -1)); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
