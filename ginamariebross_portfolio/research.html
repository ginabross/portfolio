
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>research – Gina-Marie Bross</title>
<link rel="icon" href="/favicon.png">
<meta name="description" content="Research: interests - Gina-Marie Bross.">

<style>
:root{
  --text:#000;
  --muted:#6b6b6b;
  --pad:clamp(20px,4vw,56px);
  --gap:clamp(12px,2vw,28px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  font-size:16px;
  line-height:1.5;
}

body.lb-open{overflow:hidden}

a{color:inherit;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}

a:focus-visible,button:focus-visible,.field img:focus-visible{
  outline:2px solid #000;
  outline-offset:3px;
}

h1,h2,p,figure{margin:0}

h1{font-size:16px;font-weight:400}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
}

.page{
  max-width:1440px;
  margin:0 auto;
  padding:0 var(--pad);
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

.top{
  display:flex;
  justify-content:center;
  padding:28px 0 0;
}

.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  text-decoration:none;
  padding:4px 14px;
}

.home .dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#000;
  transition:transform .2s ease;
}

.home .back{
  font-size:15px;
  transition:color .2s ease;
}

.home:hover .dot,.home:focus-visible .dot{
  transform:scale(1.35);
}

.home:hover .back,.home:focus-visible .back{
  color:var(--muted);
}

.home:focus-visible{
  outline:2px solid #000;
  outline-offset:3px;
}

main{
  flex:1;
  padding:clamp(48px,7vw,96px) 0 clamp(56px,8vw,110px);
}

.field{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  column-gap:var(--gap);
  row-gap:clamp(32px,6vw,88px);
  align-items:start;
  padding:clamp(56px,9vw,128px) 0 clamp(64px,10vw,140px);
}

.field figure img{
  display:block;
  width:100%;
  height:auto;
  background:#f3f3f3;
  cursor:zoom-in;
}

.field figure img:not(:first-child){
  display:none;
}

.field figure[data-more]::after{
  content:attr(data-more);
  display:block;
  margin-top:8px;
  font-size:14px;
  color:var(--muted);
}

@media (min-width:701px){
  .field figure:nth-child(7n+1){
    grid-column:1 / span 4;
  }

  .field figure:nth-child(7n+2){
    grid-column:6 / span 3;
    margin-top:clamp(24px,6vw,96px);
  }

  .field figure:nth-child(7n+3){
    grid-column:10 / span 3;
    margin-top:clamp(8px,2vw,32px);
  }

  .field figure:nth-child(7n+4){
    grid-column:2 / span 5;
  }

  .field figure:nth-child(7n+5){
    grid-column:8 / span 4;
    margin-top:clamp(24px,8vw,120px);
  }

  .field figure:nth-child(7n+6){
    grid-column:1 / span 3;
    margin-top:clamp(0px,2vw,24px);
  }

  .field figure:nth-child(7n+7){
    grid-column:5 / span 4;
    margin-top:clamp(16px,4vw,64px);
  }
}

@media (max-width:700px){
  .top{padding-top:20px}

  .field{
    grid-template-columns:1fr;
    row-gap:28px;
  }

  .field figure:nth-child(3n+1){width:80%}
  .field figure:nth-child(3n+2){width:60%;justify-self:end}
  .field figure:nth-child(3n+3){width:70%;margin-left:10%}
}

.legal{
  display:flex;
  gap:24px;
  padding:0 0 40px;
  font-size:14px;
  color:var(--muted);
}

/* Lightbox */

#lightbox{
  border:0;
  padding:0;
  margin:0;
  max-width:none;
  max-height:none;
  width:100%;
  height:100%;
  background:#fff;
  color:#000;
}

#lightbox[open]{
  display:grid;
  place-items:center;
}

#lightbox::backdrop{background:#fff}

#lightbox img{
  display:block;
  max-width:min(92vw,1800px);
  max-height:80vh;
  width:auto;
  height:auto;
  object-fit:contain;
  cursor:zoom-out;
}

.lb-btn{
  position:fixed;
  background:none;
  border:0;
  padding:12px;
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.lb-btn:hover{
  text-decoration:underline;
  text-underline-offset:3px;
}

.lb-close{
  top:14px;
  right:calc(var(--pad) - 12px);
}

.lb-prev{
  bottom:14px;
  left:calc(var(--pad) - 12px);
}

.lb-next{
  bottom:14px;
  right:calc(var(--pad) - 12px);
}

.lb-count{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  font-size:14px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="page">

<header class="top">
  <a class="home" href="index.html" aria-label="Zurück zur Startseite">
    <span class="dot"></span>
    <span class="back">back</span>
  </a>
</header>

<main>

<section class="field" aria-label="research">

  <!-- Galerie 1 -->
  <figure>
    <img src="images/research-01.jpg" alt="research, Foto 1" decoding="async">
    <img src="images/research-01-b.jpg" alt="research, Foto 1b" loading="lazy">

  </figure>

  <!-- Galerie 2 -->
  <figure>
    <img src="images/research-02.jpg" alt="research, Foto 2" decoding="async">
    <img src="images/research-02-b.jpg" alt="research, Foto 2b" loading="lazy">
    <img src="images/research-02-c.jpg" alt="research, Foto 2c" loading="lazy">
  </figure>

  <!-- Galerie 3 -->
  <figure>
    <img src="images/research-03.jpg" alt="research, Foto 3" decoding="async">
    <img src="images/research-03-b.jpg" alt="research, Foto 3b" loading="lazy">
    <img src="images/research-03-c.jpg" alt="research, Foto 3c" loading="lazy">
  </figure>

  <figure>
    <img src="images/research-04.jpg" alt="research, Foto 4" decoding="async">

  <figure>
    <img src="images/research-07.jpg" alt="research, Foto 7" decoding="async">

  <!-- Galerie 8 -->
  <figure>
    <img src="images/research-08.jpg" alt="research, Foto 8" decoding="async">

  <!-- Galerie 9 -->
  <figure>
    <img src="images/research-09.jpg" alt="research, Foto 9" decoding="async">

</section>

</main>

<div class="legal">
  <a href="impressum.html">legal</a>
</div>

</div>

<dialog id="lightbox" aria-label="Vergrößerte Ansicht">

  <button class="lb-btn lb-close" type="button">close</button>

  <img alt="">

  <button class="lb-btn lb-prev" type="button">prev</button>

  <span class="lb-count" aria-live="polite"></span>

  <button class="lb-btn lb-next" type="button">next</button>

</dialog>

<script>
(function(){

  var figures = Array.prototype.slice.call(
    document.querySelectorAll('.field figure')
  );

  var dlg = document.getElementById('lightbox');
  var big = dlg.querySelector('img');
  var count = dlg.querySelector('.lb-count');
  var prevBtn = dlg.querySelector('.lb-prev');
  var nextBtn = dlg.querySelector('.lb-next');
  var closeBtn = dlg.querySelector('.lb-close');

  var set = [];
  var current = 0;

  function show(n){
    current = (n + set.length) % set.length;

    big.src = set[current].currentSrc || set[current].src;
    big.alt = set[current].alt;

    count.textContent = set.length > 1
      ? (current + 1) + ' / ' + set.length
      : '';

    prevBtn.hidden = nextBtn.hidden = set.length < 2;
  }

  function open(fig){
    set = Array.prototype.slice.call(
      fig.querySelectorAll('img')
    );

    show(0);

    document.body.classList.add('lb-open');
    dlg.showModal();
  }

  function step(d){
    if(set.length > 1){
      show(current + d);
    }
  }

  figures.forEach(function(fig){

    var imgs = fig.querySelectorAll('img');
    var cover = imgs[0];

    if(imgs.length > 1){
      fig.setAttribute(
        'data-more',
        '+' + (imgs.length - 1)
      );
    }

    cover.setAttribute('tabindex','0');
    cover.setAttribute('role','button');

    cover.addEventListener('click',function(){
      open(fig);
    });

    cover.addEventListener('keydown',function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        open(fig);
      }
    });

  });

  prevBtn.addEventListener('click',function(){
    step(-1);
  });

  nextBtn.addEventListener('click',function(){
    step(1);
  });

  closeBtn.addEventListener('click',function(){
    dlg.close();
  });

  dlg.addEventListener('click',function(e){
    if(e.target === dlg || e.target === big){
      dlg.close();
    }
  });

  dlg.addEventListener('close',function(){
    document.body.classList.remove('lb-open');
  });

  document.addEventListener('keydown',function(e){

    if(!dlg.open) return;

    if(e.key === 'ArrowLeft') step(-1);
    if(e.key === 'ArrowRight') step(1);

  });

  var startX = null;

  dlg.addEventListener('touchstart',function(e){
    startX = e.touches[0].clientX;
  },{passive:true});

  dlg.addEventListener('touchend',function(e){

    if(startX === null) return;

    var dx = e.changedTouches[0].clientX - startX;
    startX = null;

    if(Math.abs(dx) > 50){
      step(dx < 0 ? 1 : -1);
      e.preventDefault();
    }

  });

})();
</script>

</body>
</html>
