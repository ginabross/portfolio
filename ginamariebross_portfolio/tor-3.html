<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>tor 3 – Gina-Marie Bross</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="tor 3, Projekt von Gina-Marie Bross.">
<style>
:root{--text:#000;--muted:#6b6b6b;--accent:#ff6a00;--pad:clamp(20px,4vw,56px);--gap:clamp(12px,2vw,28px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid #000;outline-offset:3px}
h1,h2,p,figure{margin:0}
h1{font-size:16px;font-weight:400}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{max-width:1440px;margin:0 auto;padding:0 var(--pad);min-height:100vh;min-height:100svh;display:flex;flex-direction:column}

/* Orangener Punkt oben in der Mitte, darunter "back" */
.top{display:flex;justify-content:center;padding:28px 0 0}
.home{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;padding:4px 14px}
.home .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);transition:transform .2s ease}
.home .back{font-size:15px;transition:color .2s ease}
.home:hover .dot,.home:focus-visible .dot{transform:scale(1.35)}
.home:hover .back,.home:focus-visible .back{color:var(--accent)}
.home:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

main{flex:1;padding:clamp(48px,7vw,96px) 0 clamp(56px,8vw,110px)}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}

/* Projektseite: Beschreibung links, Fotos rechts */
.project .info{grid-column:1 / 4;align-self:start;position:sticky;top:24px}
.project .info h1{font-weight:700}
.project .info .year{color:var(--muted);font-weight:400}
.project .info p{margin-top:12px;max-width:26em}
.project .info .meta{color:var(--muted);font-size:14px}
.gallery{grid-column:4 / 13;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start}
.gallery figure.wide{grid-column:1 / -1}
.gallery img{display:block;width:100%;height:auto;background:#f3f3f3}

/* Statement: nur Text */
.statement .text{grid-column:4 / 11;max-width:40em}
.statement .text p + p{margin-top:1em}

.legal{display:flex;gap:24px;padding:0 0 28px;font-size:14px;color:var(--muted)}

@media (max-width:900px){
  .row{display:block}
  .project .info{position:static;margin-bottom:24px}
}
@media (max-width:560px){
  .top{padding-top:20px}
  .gallery{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.home .dot,.home .back{transition:none}}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <a class="home" href="index.html" aria-label="Zurück zur Startseite">
      <span class="dot"></span>
      <span class="back">back</span>
    </a>
  </header>

  <main>
    <!--
      HIER BEARBEITEST DU DIESE SEITE.
      Links: Titel, Jahr, Beschreibung, Technik/Format.
      Rechts: Fotos. Pro Foto eine Zeile <figure>. Lade die Fotos in den Ordner images
      hoch und trage den Dateinamen bei src ein.
      <figure class="wide"> = volle Breite, <figure> = halbe Breite.
    -->
    <article class="project row">
      <div class="info">
        <h1>tor 3 <span class="year">[Jahr]</span></h1>
        <p>[Kurze Beschreibung des Projekts.]</p>
        <p class="meta">[Technik, Format]</p>
      </div>
      <div class="gallery">
        <figure class="wide"><img src="images/tor-3-01.jpg" width="1600" height="1067" loading="lazy" alt="tor 3, Foto 1"></figure>
        <figure><img src="images/tor-3-02.jpg" width="1200" height="1500" loading="lazy" alt="tor 3, Foto 2"></figure>
        <figure><img src="images/tor-3-03.jpg" width="1200" height="1500" loading="lazy" alt="tor 3, Foto 3"></figure>
      </div>
    </article>
  </main>

  <div class="legal">
    <a href="impressum.html">legal</a>
  </div>

</div>
</body>
</html>
