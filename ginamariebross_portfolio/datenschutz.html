<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Datenschutz – Gina-Marie Bross</title>
<style>
:root{--text:#000;--muted:#6b6b6b;--pad:clamp(20px,4vw,56px);--gap:clamp(12px,2vw,28px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid #000;outline-offset:3px}
h1,h2,h3,p,ul{margin:0}
h1,h2,h3{font-size:16px;font-weight:400}
.page{max-width:1440px;margin:0 auto;padding:0 var(--pad)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 32px;padding:28px 0 0}
.top .name{font-size:clamp(20px,1.8vw,26px);text-decoration:none}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}
.row > .label{grid-column:1 / 4}
.row > .content{grid-column:4 / 13;max-width:42em}
main{padding:clamp(64px,10vw,140px) 0 clamp(64px,10vw,140px)}
.doc h2{font-weight:700;margin-top:2em}
.doc h2:first-child{margin-top:0}
.doc h3{font-weight:700;margin-top:1.5em}
.doc p,.doc ul{margin-top:.8em}
.doc ul{padding-left:1.2em}
.note{color:var(--muted)}
@media (max-width:900px){
  .row{display:block}
  .row > .label{margin-bottom:24px;color:var(--muted)}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="name" href="index.html">Gina Marie Bross</a>
    <nav><a href="index.html">zurück</a></nav>
  </header>
  <main class="row">
    <h1 class="label">Datenschutz</h1>
    <div class="content doc">
      <!--
        HIER DEN TEXT AUS DEM DATENSCHUTZ-GENERATOR EINFÜGEN.
        Der Generator liefert meist HTML mit <h2>, <h3> und <p>.
        Das Design (Schrift, Abstände) übernimmt diese Seite automatisch.
        Den Platzhalter-Absatz unten danach löschen.
      -->
      <h2>Datenschutzerklärung</h2>
      <p class="note">[Platzhalter:]</p>

    </div>
  </main>
</div>
</body>
</html>
