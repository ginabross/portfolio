<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Gina-Marie Bross</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="description" content="Gina-Marie Bross: works, about, contact, research.">
<meta property="og:title" content="Gina-Marie Bross">
<meta property="og:description" content="works, about, contact, research.">
<meta property="og:type" content="website">
<style>
:root{--text:#000;--muted:#6b6b6b;--accent:#ff6a00;--pad:clamp(20px,4vw,56px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit}
h1,p,ul{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.page{max-width:1440px;margin:0 auto;padding:12px var(--pad) 0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}

/* Punkte mit Beschriftung, ohne Verbindungen (wie die Graph View in Obsidian) */
.graph{position:relative;flex:1;min-height:420px}
.graph svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.node{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.node .hit{fill:transparent;stroke:transparent;stroke-width:1}
.node:focus-visible .hit{stroke:var(--accent)}
.node .dot{fill:var(--accent);transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.node text{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#000;pointer-events:none;user-select:none;transition:fill .2s ease}
.node:hover .dot,.node:focus-visible .dot{transform:scale(1.35)}
.node:hover text,.node:focus-visible text{fill:var(--accent)}
.map-in{animation:mapin .6s ease both}
@keyframes mapin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.map-in{animation:none}.node .dot,.node text{transition:none}}

/* Ohne JavaScript: normale Liste */
.sitemap ul{list-style:none;padding:0}
.sitemap ul ul{padding-left:1.2em;margin-bottom:12px}
.sitemap a{text-decoration:none}
.sitemap > ul > li > a{font-size:clamp(24px,4vw,40px);line-height:1.4}
.sitemap ul ul a{font-size:16px;color:var(--muted)}
.sitemap{padding:48px 0}
body.js .sitemap{display:none}
body:not(.js) svg{display:none}

.legal{display:flex;gap:24px;padding:0 0 28px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="page">

  <h1 class="sr-only">Gina-Marie Bross</h1>

  <main class="graph" id="graph">
    <svg id="svg" role="group" aria-label="Menü"></svg>

    <!--
      HIER BEARBEITEST DU DIE PUNKTE.
      Jede Zeile <li> ist ein Punkt. Ändere Text und Link oder füge Zeilen hinzu
      oder lösche sie. Die Punkte ordnen sich automatisch an.
    -->
    <nav class="sitemap" id="sitemap" aria-label="Hauptmenü">
      <ul>
        <li><a href="portfolio.html#projekte">das, was nie dagewesen ist</a></li>
        <li><a href="portfolio.html#projekt-1">Ral-6031</a></li>
        <li><a href="portfolio.html#statement">was jetzt das ist</a></li>
        <li><a href="portfolio.html#projekt-2">permeabilities</a></li>
        <li><a href="research.html">research</a></li>
        <li><a href="portfolio.html#shows">memories of some place</a></li>
        <li><a href="portfolio.html#projekt-3">over it, through it, past it</a></li>
         <li><a href="portfolio.html#projekt-3">untitled</a></li>
        <li><a href="portfolio.html#kontakt">nowhere to go/everything to see</a></li>
        <li><a href="portfolio.html#statement">statement</a></li>
        <li><a href="mailto:gina-marie.bross@gmx.de">e-mail</a></li>
      </ul>
    </nav>
  </main>

  <div class="legal">
    <a href="impressum.html">legal</a>
  </div>

</div>

<script>
(function () {
  document.body.classList.add('js');

  var NS = 'http://www.w3.org/2000/svg';
  var box = document.getElementById('graph');
  var svg = document.getElementById('svg');
  var src = document.getElementById('sitemap');

  /* 1) Punkte aus der Liste im HTML lesen */
  var ITEMS = Array.prototype.map.call(src.querySelectorAll('li > a'), function (a) {
    return { label: a.textContent.trim(), href: a.getAttribute('href') };
  });

  /* Lage der zehn Punkte (Anteile der Fläche, eng zusammen). Bei anderer Anzahl wird automatisch verteilt. */
  var LAY10 = [[0.636, 0.271], [0.751, 0.448], [0.496, 0.352], [0.661, 0.604], [0.398, 0.285],
               [0.339, 0.515], [0.526, 0.567], [0.419, 0.700], [0.270, 0.352], [0.585, 0.744]];
  var ZIGZAG = [0.28, 0.72, 0.45, 0.78, 0.22, 0.58, 0.30, 0.74, 0.40, 0.66];

  /* Bewegung bei der Maus: Radius, Stärke, Feder, Dämpfung */
  var R = 120, PUSH = 1.1, SPRING = 0.10, DAMP = 0.84;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NARROW_BELOW = 780;
  var DOT = 5.5, LABEL_DY = 26, FS = 15;
  var W = 0, H = 0, narrow = false;
  var nodes = [], hovered = null, mouse = { x: 0, y: 0, vx: 0, vy: 0, active: false }, running = false;

  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  var cache = {};
  function measure(text) {
    if (cache[text]) return cache[text];
    var t = el('text', { 'font-size': FS, x: -9999, y: -9999, 'font-family': 'Arial,Helvetica,sans-serif' });
    t.textContent = text;
    svg.appendChild(t);
    var w = t.getComputedTextLength();
    svg.removeChild(t);
    cache[text] = w;
    return w;
  }

  /* 2) Lage berechnen */
  function neededHeight() { return Math.max(420, 2 * 40 + (ITEMS.length - 1) * 62); }

  function positions() {
    var n = ITEMS.length, P = [], i;
    if (narrow) {
      var top = 40, step = n > 1 ? (H - 2 * top - LABEL_DY) / (n - 1) : 0;
      for (i = 0; i < n; i++) P.push({ x: ZIGZAG[i % ZIGZAG.length] * W, y: top + i * step });
    } else if (n === LAY10.length) {
      for (i = 0; i < n; i++) P.push({ x: LAY10[i][0] * W, y: LAY10[i][1] * H });
    } else {
      for (i = 0; i < n; i++) {
        var r = Math.sqrt((i + 0.5) / n), a = i * 2.39996;
        P.push({ x: W / 2 + r * 0.30 * W * Math.cos(a), y: H / 2 + r * 0.34 * H * Math.sin(a) });
      }
    }
    return P;
  }

  /* Überlappende Beschriftungen leicht auseinanderschieben */
  function relax(P) {
    var n = P.length, lens = ITEMS.map(function (it) { return measure(it.label); });
    function rect(i) { return { l: P[i].x - lens[i] / 2 - 8, r: P[i].x + lens[i] / 2 + 8, t: P[i].y - 12, b: P[i].y + LABEL_DY + 10 }; }
    for (var it = 0; it < 120; it++) {
      var moved = false;
      for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
        var a = rect(i), b = rect(j);
        var ox = Math.min(a.r, b.r) - Math.max(a.l, b.l), oy = Math.min(a.b, b.b) - Math.max(a.t, b.t);
        if (ox > 0 && oy > 0) {
          moved = true;
          if (ox < oy) { var s = (P[i].x < P[j].x ? -1 : 1) * (ox / 2 + 0.5); P[i].x += s; P[j].x -= s; }
          else { var s2 = (P[i].y < P[j].y ? -1 : 1) * (oy / 2 + 0.5); P[i].y += s2; P[j].y -= s2; }
        }
      }
      for (var k = 0; k < n; k++) {
        P[k].x = Math.max(lens[k] / 2 + 14, Math.min(W - lens[k] / 2 - 14, P[k].x));
        P[k].y = Math.max(22, Math.min(H - LABEL_DY - 14, P[k].y));
      }
      if (!moved) break;
    }
    return P;
  }

  /* 3) Zeichnen */
  function render() {
    var r = box.getBoundingClientRect();
    W = r.width; narrow = W < NARROW_BELOW;
    var need = narrow ? neededHeight() : 0;
    box.style.minHeight = narrow ? need + 'px' : '';
    H = Math.max(box.getBoundingClientRect().height, need);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    nodes = []; hovered = null;

    var P = relax(positions());
    ITEMS.forEach(function (it, i) {
      var x = P[i].x, y = P[i].y, len = measure(it.label);
      var a = el('a', { 'class': 'node', href: it.href, 'aria-label': it.label });
      a.appendChild(el('rect', { 'class': 'hit', x: x - len / 2 - 10, y: y - 14, width: len + 20, height: LABEL_DY + 28, rx: 4 }));
      a.appendChild(el('circle', { 'class': 'dot', cx: x, cy: y, r: DOT }));
      var t = el('text', { x: x, y: y + LABEL_DY, 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      t.textContent = it.label;
      a.appendChild(t);
      svg.appendChild(a);
      var n = { el: a, hx: x, hy: y, x: x, y: y, vx: 0, vy: 0 };
      nodes.push(n);
      a.addEventListener('pointerenter', function (e) {
        if (e.pointerType !== 'mouse' || reduce) return;
        hovered = n;                                          /* kleiner Stups beim Darüberfahren */
        n.vx += Math.max(-3, Math.min(3, mouse.vx * 0.2));
        n.vy += Math.max(-3, Math.min(3, mouse.vy * 0.2));
        kick();
      });
      a.addEventListener('pointerleave', function () { if (hovered === n) hovered = null; });
    });
  }

  /* 4) Weiche Bewegung: Punkte in der Nähe der Maus weichen leicht aus und federn zurück */
  function step() {
    var moving = false;
    nodes.forEach(function (n) {
      var ax = (n.hx - n.x) * SPRING, ay = (n.hy - n.y) * SPRING;
      if (mouse.active && n !== hovered) {
        var dx = n.x - mouse.x, dy = n.y - mouse.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < R && d > 0.01) { var f = Math.pow(1 - d / R, 2) * PUSH; ax += dx / d * f; ay += dy / d * f; }
      }
      n.vx = (n.vx + ax) * DAMP; n.vy = (n.vy + ay) * DAMP;
      n.x += n.vx; n.y += n.vy;
      if (Math.abs(n.vx) > 0.02 || Math.abs(n.vy) > 0.02 || Math.abs(n.x - n.hx) > 0.1 || Math.abs(n.y - n.hy) > 0.1) moving = true;
      else { n.x = n.hx; n.y = n.hy; n.vx = n.vy = 0; }
      n.el.setAttribute('transform', 'translate(' + (n.x - n.hx).toFixed(2) + ',' + (n.y - n.hy).toFixed(2) + ')');
    });
    if (moving || mouse.active) requestAnimationFrame(step); else running = false;
  }
  function kick() { if (!running && !reduce) { running = true; requestAnimationFrame(step); } }

  svg.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse' || reduce) return;
    var r = svg.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    mouse.vx = mouse.active ? x - mouse.x : 0; mouse.vy = mouse.active ? y - mouse.y : 0;
    mouse.x = x; mouse.y = y; mouse.active = true;
    kick();
  });
  svg.addEventListener('pointerleave', function () { mouse.active = false; hovered = null; kick(); });

  var t0;
  window.addEventListener('resize', function () { clearTimeout(t0); t0 = setTimeout(render, 60); });
  svg.classList.add('map-in');
  render();
})();
</script>
</body>
</html>
